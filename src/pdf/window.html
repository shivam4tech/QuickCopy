<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickCopy · PDF</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        background: #0d1117;
        color: #e6edf3;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      #qc-pdf-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 14px;
        background: #161b22;
        border-bottom: 1px solid #21262d;
        flex-shrink: 0;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        font-size: 13px;
        font-weight: 600;
      }
      .brand svg {
        flex-shrink: 0;
      }
      .brand .sep {
        color: #8b949e;
        font-weight: 400;
      }
      #qc-pdf-filename {
        color: #8b949e;
        font-weight: 400;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .actions {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
      }
      #qc-pdf-pagenav {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: #8b949e;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      #qc-pdf-page {
        width: 48px;
        padding: 4px 6px;
        background: #0d1117;
        border: 1px solid #21262d;
        border-radius: 6px;
        color: #e6edf3;
        font-size: 12px;
        text-align: center;
        outline: none;
        font-variant-numeric: tabular-nums;
      }
      #qc-pdf-page:focus {
        border-color: #58a6ff;
      }
      #qc-pdf-page:disabled {
        opacity: 0.5;
      }
      #qc-pdf-status {
        font-size: 12px;
        color: #8b949e;
      }
      #qc-pdf-status.busy {
        color: #58a6ff;
      }
      #qc-pdf-status.error {
        color: #f85149;
      }
      #qc-pdf-status.success {
        color: #3fb950;
      }
      #qc-pdf-close {
        background: transparent;
        border: 1px solid #21262d;
        color: #8b949e;
        width: 26px;
        height: 26px;
        border-radius: 6px;
        font-size: 14px;
        line-height: 1;
        cursor: pointer;
      }
      #qc-pdf-close:hover {
        background: #21262d;
        color: #e6edf3;
      }
      #qc-pdf-pages {
        flex: 1;
        overflow: auto;
        padding: 24px 16px 48px;
        background: #0d1117;
        scrollbar-gutter: stable;
      }
      .qc-page {
        background: #ffffff;
        margin: 0 auto 24px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
        border-radius: 2px;
      }
      #qc-pdf-error {
        display: none;
        max-width: 560px;
        margin: 64px auto 0;
        padding: 20px 24px;
        background: #161b22;
        border: 1px solid #21262d;
        border-radius: 12px;
        font-size: 13px;
        line-height: 1.6;
        color: #c9d1d9;
        text-align: center;
      }
      #qc-pdf-error.visible {
        display: block;
      }
      #qc-pdf-error .title {
        font-weight: 600;
        color: #f85149;
        margin-bottom: 6px;
      }
    </style>
  </head>
  <body>
    <header id="qc-pdf-header">
      <div class="brand">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#58a6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="8" y="2" width="8" height="4" rx="1" />
          <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" />
          <path d="M12 11v6" />
          <path d="M9 14l3 3 3-3" />
        </svg>
        <span>QuickCopy</span>
        <span class="sep">·</span>
        <span id="qc-pdf-filename">PDF</span>
      </div>
      <div class="actions">
        <span id="qc-pdf-status">Loading…</span>
        <label id="qc-pdf-pagenav" title="Go to page (Enter)">
          <input id="qc-pdf-page" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" disabled />
          <span>/ <span id="qc-pdf-total">–</span></span>
        </label>
        <button id="qc-pdf-close" title="Close (Esc)">✕</button>
      </div>
    </header>
    <main id="qc-pdf-pages"></main>
    <div id="qc-pdf-error"></div>
    <script type="module" src="./window.ts"></script>
  </body>
</html>
